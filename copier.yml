# CONFIGURATION -------------------------
_min_copier_version: "9"
_envops:
  autoescape: false
  keep_trailing_newline: true
_subdirectory: project
_templates_suffix: .jinja
## Project information
project_name:
  type: str
  help: Your project name
project_description:
  type: str
  help: Your project description for the pyproject.toml file
author_username:
  type: str
  help: wHO ArE yOU?
author_email:
  type: str
  help: hOW cAN i cONtACt yOU?
## Git information
git_remote_url:
  type: str
  help: Copy paste the URL provided by your platform
## Python package information
python_package_distribution_name:
  type: str
  help: Your Python package distribution name (for `pip install <NAME>`)
python_package_import_name:
  type: str
  help: Your Python package import name (for `import <NAME>` in Python code)
python_version:
  type: str
  help: Which Python version do you want to use for local development? (CI always tests 3.12, 3.13 and 3.14 regardless)
  choices:
    - "3.12"
    - "3.13"
    - "3.14"
  default: "3.14"
## Git hooks
pre_commit_tool:
  type: str
  help: Which git hook manager do you want to use? Both read the same .pre-commit-config.yaml
  choices:
    - prek
    - pre-commit
  default: prek
